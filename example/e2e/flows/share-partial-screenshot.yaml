appId: ${APP_ID}
name: Share partial screenshot
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: share-partial-screenshot
- runFlow:
    file: subflows/assert-share-sheet.yaml
    env:
      SHARED_NAME: partialScreen
      SHARED_TYPE: PNG Image
- runFlow: subflows/close-share-sheet.yaml
- extendedWaitUntil:
    visible:
      id: share-status
      text: Shared
    timeout: 10000
