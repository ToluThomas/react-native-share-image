name: E2E

on:
  pull_request:
    branches: [main]

# A new push to the same pull request cancels the run that's still going.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.12.1

jobs:
  android:
    name: Android end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the Android emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install example dependencies
        run: npm install
        working-directory: example

      - name: Build debug app
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64
        working-directory: example/android

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start Metro
        run: nohup npx react-native start > "$RUNNER_TEMP/metro.log" 2>&1 &
        working-directory: example

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install example/android/app/build/outputs/apk/debug/app-debug.apk
            example/e2e/run.sh android --format JUNIT --output "$RUNNER_TEMP/maestro-android.xml"

      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/maestro-android.xml
            ${{ runner.temp }}/metro.log

  ios:
    name: iOS end-to-end
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example

      - name: Install example dependencies
        run: npm install
        working-directory: example

      - name: Install pods
        run: bundle exec pod install
        working-directory: example/ios

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build debug app
        run: |
          set -o pipefail
          xcodebuild -workspace ShareImageExample.xcworkspace -scheme ShareImageExample \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath build/e2e build | tail -50
        working-directory: example/ios

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start Metro
        run: nohup npx react-native start > "$RUNNER_TEMP/metro.log" 2>&1 &
        working-directory: example

      - name: Run Maestro flows
        run: |
          xcrun simctl install "$SIMULATOR_UDID" ios/build/e2e/Build/Products/Debug-iphonesimulator/ShareImageExample.app
          e2e/run.sh ios --format JUNIT --output "$RUNNER_TEMP/maestro-ios.xml"
        working-directory: example

      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/maestro-ios.xml
            ${{ runner.temp }}/metro.log
